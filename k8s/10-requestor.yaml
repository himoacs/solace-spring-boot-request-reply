# The requestor: a StatefulSet, not a Deployment, and the reason is the reply queue.
#
# Each instance owns a DURABLE, EXCLUSIVE reply queue named from `reply.instance-id`, which
# defaults to the hostname. A StatefulSet gives a pod a stable ordinal name, so a restarted
# booking-requestor-0 comes back as booking-requestor-0 and rebinds the queue it already had.
#
# A Deployment would give every pod a fresh random name, so each rollout would leave the previous
# pod's durable queue behind on the broker, still spooling replies nobody will ever read.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: booking-requestor
spec:
  serviceName: booking-requestor
  replicas: 1
  selector:
    matchLabels: { app: booking-requestor }
  template:
    metadata:
      labels: { app: booking-requestor }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: booking-demo:local
          imagePullPolicy: Never          # built straight into minikube; never pull from a registry
          args: ["--spring.profiles.active=requestor"]
          envFrom:
            - configMapRef: { name: solace-connection }
          env:
            # Both default to the hostname, which is the pod name. Set explicitly so the intent is
            # visible in the manifest rather than depending on the runtime populating HOSTNAME.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SOLACE_CLIENT_NAME
              value: "$(POD_NAME)"
            - name: SOLACE_REQUEST_REPLY_REPLY_INSTANCE_ID
              value: "$(POD_NAME)"
          ports:
            - { name: http, containerPort: 8091 }
          readinessProbe:
            # The reply-path indicator: a pod whose reply endpoint is not established would accept
            # bookings and answer every one of them with a timeout, so it must not receive traffic.
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-requestor
spec:
  selector: { app: booking-requestor }
  ports:
    - { name: http, port: 8091, targetPort: http }
