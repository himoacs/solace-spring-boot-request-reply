# Broker connection. The broker runs on the laptop, not in the cluster, so pods reach it through
# the address minikube gives the host. `host.minikube.internal` is only in the *node's* hosts
# file, not in pod DNS, so the address is carried here explicitly.
#
#   minikube ssh -- grep host.minikube.internal /etc/hosts
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: solace-connection
data:
  SOLACE_HOST: "tcp://192.168.65.254:55565"
  SOLACE_VPN: "default"
  SOLACE_USER: "default"
  SOLACE_PASS: "default"
